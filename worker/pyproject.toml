[project]
name = "veille-worker"
version = "0.1.0"
description = "Worker de veille : collecte, extraction, résumé et catégorisation via vLLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "psycopg[binary]>=3.3.6",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: appelle des services réels (vLLM) ; exclure avec -m \"not slow\"",
    "db: SQL réel contre le Postgres de Compose (veille_worker) ; ignoré sans WORKER_DB_PASSWORD",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
